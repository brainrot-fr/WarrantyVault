name: Daily warranty reminders

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend reminder run
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BACKEND_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            "$BACKEND_BASE_URL/api/internal/run-reminders"
