name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify app and database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test Supabase functions
        run: deno test supabase/functions
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Responsive browser tests
        run: npm run test:e2e
      - name: Verify OCR build assets
        run: npm run check:ocr-assets
      - name: Start local Supabase
        run: npx supabase start
      - name: Test database policies and migrations
        run: npm run db:test
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
