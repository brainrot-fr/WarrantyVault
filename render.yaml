services:
  - type: web
    name: warrantyvault-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: bills
      - key: SIGNED_URL_SECONDS
        value: "600"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: OCR_ENABLED
        value: "false"
      - key: TESSDATA_PATH
        value: /usr/share/tesseract-ocr/5/tessdata
      - key: CRON_SECRET
        sync: false
      - key: REMINDER_CRON
        value: "0 0 9 * * *"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: INVITE_EXPIRY_DAYS
        value: "7"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -XX:+UseSerialGC"
