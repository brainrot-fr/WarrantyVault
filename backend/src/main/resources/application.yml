server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 5MB
    max-http-form-post-size: 6MB
spring:
  application:
    name: warranty-vault-api
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/warrantyvault}
    username: ${SUPABASE_DB_USERNAME:warrantyvault}
    password: ${SUPABASE_DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
app:
  auth:
    project-ref: ${SUPABASE_PROJECT_REF:}
    jwk-set-uri: ${SUPABASE_JWKS_URL:}
    legacy-hs256-secret: ${SUPABASE_JWT_SECRET:}
  storage:
    base-url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:bills}
    signed-url-seconds: ${SIGNED_URL_SECONDS:600}
  ocr:
    enabled: ${OCR_ENABLED:false}
    tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  reminders:
    cron: ${REMINDER_CRON:0 0 9 * * *}
    secret: ${CRON_SECRET:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  invite-expiry-days: ${INVITE_EXPIRY_DAYS:7}
  mail:
    from: ${MAIL_FROM:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
